<div class="app">

  tent: { sizes:{ s:{w:100,h:34}, m:{w:120,h:38}, l:{w:145,h:42} } }   // 底脚深度见 state.footMm
};

  { id:'gold', name:'黑金', bg:'#0b0b0d', fg:'#d9b25f',

  { id:'space', name:'深空', bg:'#0b1b33', fg:'#e9effb',

  { id:'vhs', name:'录像带', bg:'#101018', fg:'#f2f2f7',
    pattern:'repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 .3mm,transparent .3mm 1.3mm)',
    font:'mono', border:'double' }
];

/* 注：PingFang SC 最粗只有 Semibold，数字要够黑得用 Helvetica Neue / Arial Black
   字体名统一用单引号，方便嵌进 HTML 的 style="" 里 */
const FONTS = {
  hei    :{ num:"'Helvetica Neue','PingFang SC',sans-serif",              weight:700 },
  black  :{ num:"'Arial Black','Helvetica Neue','PingFang SC',sans-serif", weight:400 },
  din    :{ num:"'DIN Condensed','Helvetica Neue','PingFang SC',sans-serif", weight:700 },
  impact :{ num:"Impact,'Arial Black','PingFang SC',sans-serif",           weight:400 },
  mono   :{ num:"'SF Mono',Menlo,ui-monospace,monospace",                  weight:700 },
  songti :{ num:"'Songti SC','PingFang SC',serif",                         weight:700 },
  kaiti  :{ num:"'Kaiti SC','PingFang SC',serif",                          weight:400 }
};

const BORDERS = {
  none:'none', thin:'.35mm solid currentColor',
  double:'1.1mm double currentColor', bold:'1.2mm solid currentColor'
};



/* ==================================================================
   3. 状态
   ================================================================== */
const state = {
  size:'m', copies:'auto', footMm:25,
  themeId:'plain', font:'hei', border:'thin',
  bg:null, fg:null,          // null = 跟随主题
  showFold:true
};

const $ = s => document.querySelector(s);
const phoneEl = $('#phone'), subEl = $('#sub'), spacedEl = $('#spaced'),
      foldEl = $('#showFold'), stageInner = $('#stageInner'), sheetHost = $('#sheetHost');

const theme = () => THEMES.find(t => t.id === state.themeId);
const escapeHTML = s => String(s||'').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatNumber(raw, spaced){
  const d = (raw||'').replace(/\D/g,'').slice(0,11);
  if(!spaced) return d;
  if(d.length<=3) return d;
  if(d.length<=7) return d.slice(0,3)+' '+d.slice(3);
  return d.slice(0,3)+' '+d.slice(3,7)+' '+d.slice(7);
}

/* 成品 / 纸面尺寸 */
function metrics(){
  const sz = LAYOUTS.tent.sizes[state.size];
  return { w:sz.w, h:sz.h, pw:sz.w, ph:sz.h*2 + state.footMm*2, foot:state.footMm };
}

/* 网格排布 */
function grid(){
  const m = metrics();
  const cols = Math.max(1, Math.floor((SHEET.w - 2*SHEET.margin + SHEET.gap) / (m.pw + SHEET.gap)));
  const rows = Math.max(1, Math.floor((SHEET.h - 2*SHEET.margin + SHEET.gap) / (m.ph + SHEET.gap)));
  const max  = Math.min(cols*rows, 12);
  const want = state.copies === 'auto' ? max : Math.min(+state.copies, max);

  const useCols = Math.min(cols, want);
  const useRows = Math.ceil(want / useCols);
  const blockW = useCols*m.pw + (useCols-1)*SHEET.gap;
  const blockH = useRows*m.ph + (useRows-1)*SHEET.gap;
  const x0 = (SHEET.w - blockW)/2, y0 = (SHEET.h - blockH)/2;

  const cells = [];
  for(let i=0;i<want;i++){
    const c = i % useCols, r = Math.floor(i / useCols);
    cells.push({ x: x0 + c*(m.pw+SHEET.gap), y: y0 + r*(m.ph+SHEET.gap) });
  }
  return { cells, max, want };
}

/* ==================================================================
   4. 构建 A4
   ================================================================== */
function applyThemeVars(el){
  const t = theme();
  el.style.setProperty('--t-bg', state.bg || t.bg);
  el.style.setProperty('--t-fg', state.fg || t.fg);
  el.style.setProperty('--t-pattern', t.pattern || 'none');
  el.style.setProperty('--t-pattern-size', t.patternSize || 'auto');
  el.style.setProperty('--frame', BORDERS[state.border]);
  el.style.setProperty('--radius', t.radius || '0');
  if(t.stripes) el.style.setProperty('--t-stripe', t.stripes);
  return el;
}

function buildSheet(o){
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  applyThemeVars(sheet);
  grid().cells.forEach(pos => sheet.appendChild(buildPiece(o, pos, theme())));
  sheet.appendChild(rulerBar());
  return sheet;
}

function buildPiece(o, pos, t){
  const m = metrics();
  const piece = document.createElement('div');
  piece.className = 'piece';
  piece.style.cssText = `left:${pos.x}mm;top:${pos.y}mm;width:${m.pw}mm;height:${m.ph}mm`;
  const stripe = t.stripes ? 'stripes' : '';

  // 折线在中间、印刷面朝外时，两个面的字头都要朝向折线：
  // 上半（内侧）倒置、下半（外侧）正向。反过来做，折完全部是倒的。
  piece.appendChild(faceEl(o.inner, 0, m.foot, m.w, m.h, ('flip '+stripe).trim()));
  piece.appendChild(faceEl(o.outer, 0, m.foot+m.h, m.w, m.h, stripe));

  if(o.showFold){
    [m.foot, m.foot+m.h, m.foot+m.h*2].forEach(y=>{
      const fl = document.createElement('div');
      fl.className = 'fold-h'; fl.style.top = y+'mm';
      piece.appendChild(fl);
    });
  }

  piece.appendChild(Object.assign(document.createElement('div'), {className:'cut'}));
  return piece;
}

function faceEl(content, x, y, w, h, extraClass){
  const f = document.createElement('div');
  f.className = 'face' + (extraClass ? ' '+extraClass : '');
  f.style.cssText = `left:${x}mm;top:${y}mm;width:${w}mm;height:${h}mm`;

  const subSize = Math.max(2.5, Math.min(5, h*0.115)).toFixed(2);
  const padY = Math.max(2.6, h*0.10).toFixed(2);

  f.style.setProperty('--stripe-h', Math.max(2.8, Math.min(5, h*0.13)).toFixed(2)+'mm');

  const frame = document.createElement('div');
  frame.className = 'frame';

  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.style.padding = `${padY}mm 4mm`;

  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.style.fontSize = subSize + 'mm';
  sub.textContent = content.small || '';
  if(!content.small) sub.style.display = 'none';

  const num = document.createElement('div');
  num.className = 'num';
  // 用 DOM 属性设置，避免字体名里的引号把 style 属性截断
  num.style.fontFamily = FONTS[state.font].num;
  num.style.fontWeight = FONTS[state.font].weight;
  num.textContent = content.main || '';
  if(content.maxHRatio) num.dataset.maxh = content.maxHRatio;
  if(!content.main) num.style.display = 'none';

  pad.append(sub, num);
  f.append(frame, pad);
  return f;
}

/* 50mm 标尺：验证打印是否 100% */
function rulerBar(){
  const d = document.createElement('div');
  d.className = 'ruler';
  d.style.cssText = `left:${SHEET.w - SHEET.margin - 50}mm;top:${SHEET.h - 5.4}mm;width:50mm`;
  d.innerHTML = `<div class="bar" style="width:50mm"></div>
    <div style="margin-top:.4mm">50mm 标尺 · 量不对说明缩放不是 100%</div>`;
  return d;
}

/* ==================================================================
   4.5 3D 预览（纯 CSS 3D，无外部库）
   ================================================================== */
const V3 = { rx: 16, ry: 26 };
/* 每种版式给一个能看清结构的默认视角 */
const VIEW_DEFAULT = { rx: 12, ry: 38 };
const DEG = Math.PI/180;

function blankFace(w, h){
  const f = document.createElement('div');
  f.className = 'face';
  f.style.cssText = `left:0;top:0;width:${w}mm;height:${h}mm`;
  return f;
}

/* 返回一组 { el, tf, origin }：正面 + 贴背面的空白层，避免看到镜像文字 */
function threePanels(o){
  const m = metrics(), t = theme();
  const stripe = t.stripes ? 'stripes' : '';
  const out = [];
  const add = (el, tf, origin) => out.push({ el, tf, origin: origin || 'center center' });

  const beta = 18*DEG;
  const base = m.h*Math.cos(beta);           // 脊到脚线的垂直高度
  const dz   = m.h*Math.sin(beta);           // 脊到脚线的水平外扩
  const dy   = -base/2;                      // 让整体垂直居中

  // 正面 = 外侧（号码），朝观察者
  const tfF = `translate(-50%,${dy.toFixed(2)}mm) rotateX(18deg)`;
  add(faceEl(o.outer,0,0,m.w,m.h,stripe), tfF, '50% 0%');
  add(blankFace(m.w,m.h), tfF + ' translateZ(-0.5mm)', '50% 0%');

  // 背面 = 内侧（朝驾驶员），绕 Y 转 180 让它朝后
  const tfB = `translate(-50%,${dy.toFixed(2)}mm) rotateX(-18deg) rotateY(180deg)`;
  add(faceEl(o.inner,0,0,m.w,m.h,stripe), tfB, '50% 0%');
  add(blankFace(m.w,m.h), tfB + ' translateZ(-0.5mm)', '50% 0%');

  // 两条折下去贴台面的脚
  add(blankFace(m.w, m.foot),
      `translate3d(-50%,${(base/2).toFixed(2)}mm,${dz.toFixed(2)}mm) rotateX(90deg)`, '50% 0%');
  add(blankFace(m.w, m.foot),
      `translate3d(-50%,${(base/2).toFixed(2)}mm,${(-dz).toFixed(2)}mm) rotateX(-90deg) rotateY(180deg)`, '50% 0%');

  return out;
}

/* 先把旋转应用上去，再按「投影后的包围盒」缩放并居中。
   之前只按宽度估缩放，转到俯视时深度展开就会溢出画布。 */
function applyRotation(){
  const pane  = $('#pane3d');
  const scene = pane.querySelector('.scene3d');
  const wrap  = pane.querySelector('.scene-wrap');
  if(!scene || !wrap) return;

  scene.style.transform = `rotateX(${V3.rx.toFixed(1)}deg) rotateY(${V3.ry.toFixed(1)}deg)`;

  const paneRect = pane.getBoundingClientRect();
  if(!paneRect.width) return;                       // 面板隐藏时/首次布局前先跳过

  wrap.style.transform = 'none';
  const r = scene.getBoundingClientRect();          // 旋转后的投影包围盒
  if(!r.width || !r.height) return;

  const pad = 46;
  const s = Math.max(0.25, Math.min(1.6,
    Math.min((paneRect.width - pad*2) / r.width,
             (paneRect.height - pad*2) / r.height)));

  const cx = (r.left + r.width/2)  - (paneRect.left + paneRect.width/2);
  const cy = (r.top  + r.height/2) - (paneRect.top  + paneRect.height/2);
  wrap.style.transform = `scale(${s.toFixed(3)}) translate(${(-cx).toFixed(1)}px, ${(-cy).toFixed(1)}px)`;
}

function render3D(o){
  const pane = $('#pane3d');
  if(!pane) return;

  const panels = threePanels(o);

  // 先在无 3D 变换的临时容器里做字号自适应（3D 变换会污染 getBoundingClientRect）
  const scratch = document.createElement('div');
  scratch.style.cssText = 'position:absolute;left:-9999px;top:0';
  applyThemeVars(scratch);
  document.body.appendChild(scratch);
  panels.forEach(p => scratch.appendChild(p.el));
  fitAllNumbers(scratch);
  document.body.removeChild(scratch);

  const wrap  = document.createElement('div');
  wrap.className = 'scene-wrap';
  const scene = document.createElement('div');
  scene.className = 'scene3d';
  applyThemeVars(scene);

  panels.forEach(p => {
    p.el.style.transform = p.tf;
    p.el.style.transformOrigin = p.origin;
    scene.appendChild(p.el);
  });
  wrap.appendChild(scene);

  pane.querySelectorAll('.scene-wrap').forEach(n => n.remove());
  pane.appendChild(wrap);
  applyRotation();
}

/* ==================================================================
   5. 字号自适应
   ================================================================== */
function fitAllNumbers(root){
  root.querySelectorAll('.face').forEach(face=>{
    const pad = face.querySelector('.pad');
    const num = face.querySelector('.num');
    const sub = face.querySelector('.sub');
    if(!pad || !num || num.style.display === 'none') return;

    const faceH = face.getBoundingClientRect().height;
    const padEl = pad.getBoundingClientRect();
    const subH  = sub ? sub.getBoundingClientRect().height : 0;
    const maxW  = padEl.width * 0.92;
    const ratio = num.dataset.maxh ? parseFloat(num.dataset.maxh) : 0.80;
    const maxH  = Math.max(3, faceH*ratio - subH);

    let fs = Math.min(48, faceH*0.95);
    // 字距在测量之前设好（em 单位随字号缩放），否则量完再加会溢出
    num.style.letterSpacing = '0.012em';
    num.style.fontSize = fs + 'mm';
    for(let i=0;i<90;i++){
      const r = num.getBoundingClientRect();
      if(r.width <= maxW && r.height <= maxH) break;
      fs *= 0.945;
      if(fs < 3) break;
      num.style.fontSize = fs + 'mm';
    }
  });
}

/* ==================================================================
   6. 渲染
   ================================================================== */
function currentOpts(){
  const number = formatNumber(phoneEl.value, spacedEl.checked) || '000 0000 0000';
  const innerNum = $('#innerNumber').checked;
  const innerBig = $('#innerBig').value.trim();
  const innerSmall = $('#innerSmall').value.trim();

  return {
    number,
    sub: subEl.value.trim(),
    outer: { main: number, small: subEl.value.trim(), maxHRatio: 0.80 },
    inner: {
      main: innerNum ? number : innerBig,
      small: innerSmall,
      maxHRatio: innerNum ? 0.80 : 0.45    // 文字（非号码）不要撑满整面
    },
    showFold: foldEl.checked
  };
}

function render(){
  const o = currentOpts();
  sheetHost.innerHTML = '';
  sheetHost.appendChild(buildSheet(o));

  fitAllNumbers(sheetHost);
  zoomToFit();
  render3D(o);

  const m = metrics(), g = grid();
  $('#footHint').textContent =
    `纸面 ${m.pw}×${m.ph}mm，脚占 ${Math.round(state.footMm/m.ph*100)}%。脚越长越稳，但纸面也越高。`;
  $('#sizeLabel').textContent = `成品 ${m.w}×${m.h}mm · 每页 ${g.want} 张（最多 ${g.max}）`;
  $('#paneHow').innerHTML = howtoHTML(o);
}

function mmPerPx(){
  const p = document.createElement('div');
  p.style.cssText='position:absolute;width:100mm;height:0;visibility:hidden';
  document.body.appendChild(p);
  const w = p.getBoundingClientRect().width;
  p.remove();
  return 100 / w;
}

function zoomToFit(){
  const sheet = sheetHost.querySelector('.sheet');
  if(!sheet) return;
  const availW = stageInner.clientWidth  - 32;
  const availH = stageInner.clientHeight - 32;
  if(availW <= 0 || availH <= 0) return;      // 面板隐藏时不量
  const pxPerMm = 1 / mmPerPx();
  const z = Math.min(1, availW/(pxPerMm*SHEET.w), availH/(pxPerMm*SHEET.h));
  sheet.style.zoom = z;
}

function tentDiagram(foot, o){

  return `<svg viewBox="0 0 470 158" style="width:100%;max-width:600px;display:block;margin:0">
    <g font-family="'PingFang SC',sans-serif">

/* ==================================================================
   8. 事件
   ================================================================== */
function bindChips(sel, key, cast){
  $(sel).addEventListener('click', e=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state[key] = cast ? cast(b.dataset[key]) : b.dataset[key];
    [...$(sel).children].forEach(c=>c.setAttribute('aria-pressed', c===b));
    render();
  });
}

bindChips('#sizeChips','size');
$('#fontSel').addEventListener('change', e=>{ state.font = e.target.value; render(); });
$('#borderSel').addEventListener('change', e=>{ state.border = e.target.value; render(); });

$('#footChips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  state.footMm = +b.dataset.foot;
  [...$('#footChips').children].forEach(c=>c.setAttribute('aria-pressed', c===b));
  render();
});

$('#copyChips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  state.copies = b.dataset.copies;
  [...$('#copyChips').children].forEach(c=>c.setAttribute('aria-pressed', c===b));
  render();
});

$('#themeGrid').addEventListener('click', e=>{
  const b = e.target.closest('.tcard'); if(!b) return;
  const t = THEMES.find(x=>x.id===b.dataset.theme);
  state.themeId = t.id;
  state.font = t.font;
  state.border = t.border;
  state.bg = null; state.fg = null;
  [...$('#themeGrid').children].forEach(c=>c.setAttribute('aria-pressed', c===b));
  $('#fontSel').value = t.font;
  $('#borderSel').value = t.border;
  $('#bgColor').value = t.bg;
  $('#fgColor').value = t.fg;
  render();
});

$('#bgColor').addEventListener('input', e=>{ state.bg = e.target.value; render(); });
$('#fgColor').addEventListener('input', e=>{ state.fg = e.target.value; render(); });
$('#resetColors').addEventListener('click', ()=>{
  state.bg = state.fg = null;
  const t = theme();
  $('#bgColor').value = t.bg; $('#fgColor').value = t.fg;
  render();
});

/* ---- 视图切换 ---- */
let view = '2d';
function setView(v){
  view = v;
  [...document.querySelectorAll('.vtab')].forEach(b=>b.setAttribute('aria-pressed', b.dataset.view===v));
  $('#stageBar').style.display   = v==='2d' ? '' : 'none';
  $('#stageInner').style.display = v==='2d' ? 'flex' : 'none';
  $('#pane3d').style.display     = v==='3d' ? 'flex' : 'none';
  $('#paneHow').style.display    = v==='how' ? 'flex' : 'none';
  if(v === '2d') zoomToFit();
  else if(v === '3d') applyRotation();
}
document.querySelectorAll('.vtab').forEach(b=>{
  b.addEventListener('click', ()=>setView(b.dataset.view));
});

/* ---- 拖动旋转 ---- */
const pane3d = $('#pane3d');
let drag = null;
pane3d.addEventListener('pointerdown', e=>{
  if(e.target.closest('.reset3d')) return;
  e.preventDefault();
  drag = { x:e.clientX, y:e.clientY, rx:V3.rx, ry:V3.ry };
  pane3d.classList.add('dragging');
  try{ pane3d.setPointerCapture(e.pointerId); }catch(_){}
});
pane3d.addEventListener('pointermove', e=>{
  if(!drag) return;
  V3.ry = drag.ry + (e.clientX - drag.x) * 0.45;
  V3.rx = Math.max(-55, Math.min(70, drag.rx + (e.clientY - drag.y) * 0.45));
  applyRotation();
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  pane3d.addEventListener(ev, ()=>{ drag = null; pane3d.classList.remove('dragging'); });
});
function resetView(){
  V3.rx = VIEW_DEFAULT.rx; V3.ry = VIEW_DEFAULT.ry;
  applyRotation();
}
$('#reset3d').addEventListener('click', resetView);

let timer = null;
[phoneEl, subEl, $('#innerBig'), $('#innerSmall')].forEach(el=>el.addEventListener('input', ()=>{
  clearTimeout(timer); timer = setTimeout(render, 130);
}));
[spacedEl, foldEl, $('#innerNumber')].forEach(el=>el.addEventListener('change', render));

/* 打印前把纸克隆到一个独立容器里，彻底绕开一屏布局的高度/缩放约束 */
function preparePrint(){
  const src = sheetHost.querySelector('.sheet');
  const box = document.getElementById('printOnly');
  if(!src || !box) return;
  const clone = src.cloneNode(true);
  clone.style.zoom = 1;
  clone.style.transform = 'none';
  box.innerHTML = '';
  box.appendChild(clone);
  document.body.classList.add('print-ready');
}
function cleanupPrint(){
  const box = document.getElementById('printOnly');
  if(box) box.innerHTML = '';
  document.body.classList.remove('print-ready');
}
window.addEventListener('beforeprint', preparePrint);
window.addEventListener('afterprint', cleanupPrint);

$('#printBtn').addEventListener('click', ()=>{ preparePrint(); window.print(); });

let rt = null;
window.addEventListener('resize', ()=>{
  clearTimeout(rt);
  rt = setTimeout(()=>{ zoomToFit(); applyRotation(); }, 120);
});

/* ==================================================================
   9. 启动
   ================================================================== */
resetView();
renderThemeGrid();
$('#bgColor').value = theme().bg;
$('#fgColor').value = theme().fg;
$('#fontSel').value = state.font;
$('#borderSel').value = state.border;
render();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
